<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Text</title>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:24px;background:#f5f5f7;color:#111}
  .card{max-width:520px;margin:0 auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
  .to{font-size:15px;color:#666;margin-bottom:6px}
  .num{font-size:22px;font-weight:600;margin-bottom:16px}
  .msg{white-space:pre-wrap;font-size:17px;line-height:1.4;background:#e9e9eb;border-radius:16px;padding:14px 16px;margin-bottom:22px}
  a.btn,button{display:block;width:100%;box-sizing:border-box;text-align:center;font-size:20px;font-weight:600;padding:18px;border-radius:14px;border:0;text-decoration:none;margin-bottom:12px}
  a.btn{background:#34c759;color:#fff}
  button{background:#e5e5ea;color:#111;font-size:17px;padding:14px}
  .err{color:#c00}
</style>
</head>
<body>
<div class="card" id="c"></div>
<script>
(function(){
  var p=new URLSearchParams(location.search);
  var n=(p.get('n')||'').replace(/[^\d+]/g,'');
  var b=p.get('b')||'';
  var c=document.getElementById('c');
  if(!n){c.innerHTML='<p class="err">No phone number in this link.</p>';return;}
  var href='sms:'+n+'&body='+encodeURIComponent(b);
  function esc(s){return s.replace(/[&<>"]/g,function(x){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x];});}
  var name=p.get('to');
  c.innerHTML=
    '<div class="to">Text to'+(name?' '+esc(name):'')+'</div>'+
    '<div class="num">'+esc(n)+'</div>'+
    (b?'<div class="msg">'+esc(b)+'</div>':'')+
    '<a class="btn" href="'+href+'">Open Messages</a>'+
    '<button id="cp">Copy message</button>';
  document.getElementById('cp').onclick=function(){
    navigator.clipboard.writeText(b).then(function(){document.getElementById('cp').textContent='Copied';});
  };
})();
</script>
</body>
</html>
